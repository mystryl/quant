        // 注册ZIGZAG自定义指标（TradingView标准版本）
        klinecharts.registerIndicator({
            name: 'ZIGZAG',
            shortName: 'ZIGZAG',
            precision: 4,
            calcParams: [5, 10],  // [deviation(%), depth]
            shouldOhlc: true,
            figures: [
                { key: 'zigzag', title: 'ZIGZAG: ', type: 'line' }
            ],
            calc: (dataList, { calcParams }) => {
                const deviation = calcParams[0] || 5;  // 价格偏移百分比
                const depth = calcParams[1] || 10;      // Pivot确认周期

                // 1. 找出所有潜在的pivot点（前后depth根K线确认）
                const pivots = [];

                for (let i = depth; i < dataList.length - depth; i++) {
                    const currentHigh = dataList[i].high;
                    const currentLow = dataList[i].low;

                    // 检查是否为高点（Pivot High）
                    let isHighPivot = true;
                    for (let j = 1; j <= depth; j++) {
                        if (dataList[i - j].high >= currentHigh ||
                            dataList[i + j].high >= currentHigh) {
                            isHighPivot = false;
                            break;
                        }
                    }

                    // 检查是否为低点（Pivot Low）
                    let isLowPivot = true;
                    for (let j = 1; j <= depth; j++) {
                        if (dataList[i - j].low <= currentLow ||
                            dataList[i + j].low <= currentLow) {
                            isLowPivot = false;
                            break;
                        }
                    }

                    if (isHighPivot) {
                        pivots.push({ index: i, type: 'high', value: currentHigh });
                    } else if (isLowPivot) {
                        pivots.push({ index: i, type: 'low', value: currentLow });
                    }
                }

                // 2. 应用deviation过滤，构建ZigZag序列
                const zigZagPoints = [];

                if (pivots.length > 0) {
                    // 添加第一个pivot点
                    zigZagPoints.push(pivots[0]);

                    for (let i = 1; i < pivots.length; i++) {
                        const lastPoint = zigZagPoints[zigZagPoints.length - 1];
                        const currentPivot = pivots[i];

                        // 计算价格变化百分比
                        const priceChange = Math.abs(currentPivot.value - lastPoint.value);
                        const percentChange = (priceChange / lastPoint.value) * 100;

                        // 检查是否满足deviation要求
                        if (percentChange >= deviation) {
                            // 检查是否为有效的方向转换（high->low 或 low->high）
                            if (currentPivot.type !== lastPoint.type) {
                                zigZagPoints.push(currentPivot);
                            }
                        }
                    }
                }

                // 3. 构建结果数组（只在zigzag点位置设置值）
                const results = [];
                let pointIndex = 0;

                for (let i = 0; i < dataList.length; i++) {
                    const result = {};

                    // 如果当前位置有zigzag点，设置值
                    if (pointIndex < zigZagPoints.length &&
                        zigZagPoints[pointIndex].index === i) {
                        result.zigzag = zigZagPoints[pointIndex].value;
                        pointIndex++;
                    }

                    results.push(result);
                }

                return results;
            }
