<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLineChart Pro 测试</title>
    <link rel="stylesheet" href="/static/klinecharts-pro.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f0f0f;
            color: #e0e0e0;
        }
        #app {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- ZigZag 配置按钮 -->
    <button id="zigzag-config-btn"
            style="position: fixed; top: 10px; right: 10px; padding: 10px 20px;
                   background: #FF9800; color: white; border: none; border-radius: 4px;
                   cursor: pointer; z-index: 1000; font-size: 14px;">
        ZigZag 配置
    </button>

    <!-- ZigZag 配置面板 -->
    <div id="zigzag-config-panel"
         style="position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.9);
                padding: 20px; border-radius: 8px; display: none; z-index: 1001;
                min-width: 280px; border: 1px solid #FF9800;">
        <h3 style="color: #FF9800; margin-bottom: 20px; font-size: 16px;">ZigZag 指标配置</h3>

        <div style="margin-bottom: 15px;">
            <label style="color: #e0e0e0; display: block; margin-bottom: 8px; font-size: 13px;">
                深度 (Depth): <span id="depth-value" style="color: #FF9800;">12</span>
            </label>
            <input type="range" id="zigzag-depth" min="3" max="30" value="12"
                   style="width: 100%;" oninput="document.getElementById('depth-value').textContent = this.value">
            <small style="color: #888; font-size: 11px;">查找波峰波谷时检查的K线数量</small>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="color: #e0e0e0; display: block; margin-bottom: 8px; font-size: 13px;">
                偏差 (Deviation %): <span id="deviation-value" style="color: #FF9800;">5</span>
            </label>
            <input type="range" id="zigzag-deviation" min="1" max="20" value="5" step="0.5"
                   style="width: 100%;" oninput="document.getElementById('deviation-value').textContent = this.value">
            <small style="color: #888; font-size: 11px;">最小价格变化百分比，低于此值不标记为转折点</small>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="color: #e0e0e0; display: block; margin-bottom: 8px; font-size: 13px;">
                回溯 (Backstep): <span id="backstep-value" style="color: #FF9800;">3</span>
            </label>
            <input type="range" id="zigzag-backstep" min="1" max="10" value="3"
                   style="width: 100%;" oninput="document.getElementById('backstep-value').textContent = this.value">
            <small style="color: #888; font-size: 11px;">确认转折点的滞后K线数</small>
        </div>

        <button id="zigzag-apply"
                style="width: 100%; padding: 12px; background: #FF9800; color: white;
                       border: none; border-radius: 4px; cursor: pointer; margin-bottom: 8px;
                       font-size: 14px; font-weight: bold;">
            应用配置
        </button>

        <button id="zigzag-reset"
                style="width: 100%; padding: 12px; background: #666; color: white;
                       border: none; border-radius: 4px; cursor: pointer; margin-bottom: 8px;
                       font-size: 14px;">
            重置默认
        </button>

        <button id="zigzag-close"
                style="width: 100%; padding: 12px; background: #444; color: white;
                       border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">
            关闭
        </button>
    </div>

    <script src="/static/klinecharts.min.js"></script>
    <script src="/static/klinecharts-pro.umd.js"></script>
    <script src="/static/indicators.js"></script>
    <script>
        // 自定义数据源
        class CustomDatafeed {
            constructor(apiBaseUrl) {
                this.apiBaseUrl = apiBaseUrl;
                this.contractsCache = null;
            }

            /**
             * 搜索合约
             * 触发时机：搜索框输入时
             * 返回：合约信息数组
             */
            async searchSymbols(search) {
                console.log('🔍 搜索合约:', search);

                // 从缓存或API获取合约列表
                if (!this.contractsCache) {
                    const response = await fetch(`${this.apiBaseUrl}/api/contracts`);
                    const contracts = await response.json();

                    // 转换为 SymbolInfo 格式
                    this.contractsCache = contracts.map(c => ({
                        id: c.symbol,
                        exchange: c.exchange,
                        market: 'futures',
                        name: c.name,
                        shortName: c.symbol.split('.')[0],
                        ticker: c.symbol,
                        type: 'CONT',
                        description: `${c.name} (${c.symbol})`
                    }));
                }

                // 如果有搜索关键词，进行过滤
                let result = this.contractsCache;
                if (search) {
                    const keyword = search.toLowerCase();
                    result = this.contractsCache.filter(c =>
                        c.ticker.toLowerCase().includes(keyword) ||
                        c.name.toLowerCase().includes(keyword) ||
                        c.shortName.toLowerCase().includes(keyword)
                    );
                }

                console.log(`✅ 找到 ${result.length} 个合约`);
                return result;
            }

            /**
             * 获取历史K线数据
             * 触发时机：合约或周期切换时
             * 返回：合约K线数据数组
             */
            async getHistoryKLineData(symbol, period, from, to) {
                // 将 period 对象转换为周期字符串
                const periodStr = `${period.multiplier}${period.timespan === 'minute' ? 'm' : period.timespan === 'hour' ? 'H' : period.timespan === 'day' ? 'D' : period.timespan === 'week' ? 'W' : period.timespan}`;

                console.log('📊 加载K线数据:', symbol.ticker, periodStr, from, to);

                // 从 API 获取数据，带上周期参数
                const response = await fetch(`${this.apiBaseUrl}/api/kline/${symbol.ticker}?period=${periodStr}`);
                const result = await response.json();

                if (!result.data) {
                    console.warn('⚠️ 没有数据');
                    return [];
                }

                // 转换数据格式
                const klineData = result.data.map(item => ({
                    timestamp: item.timestamp,
                    open: item.open,
                    high: item.high,
                    low: item.low,
                    close: item.close,
                    volume: item.volume
                }));

                console.log(`✅ 加载了 ${klineData.length} 条数据`);
                return klineData;
            }

            /**
             * 订阅实时数据
             * 触发时机：合约或周期切换时
             */
            subscribe(symbol, period, callback) {
                console.log('🔔 订阅实时数据:', symbol.ticker, period);
                // 暂不实现实时数据推送
                // 可以在这里建立 WebSocket 连接或使用 HTTP 轮询
            }

            /**
             * 取消订阅
             * 触发时机：合约或周期切换时
             */
            unsubscribe(symbol, period) {
                console.log('❌ 取消订阅:', symbol.ticker, period);
                // 取消 WebSocket 或停止 HTTP 轮询
            }
        }

        // 初始化应用
        async function initApp() {
            try {
                // 创建自定义数据源
                const datafeed = new CustomDatafeed('http://localhost:5001');

                // 获取第一个合约作为默认合约
                const contracts = await datafeed.searchSymbols();
                if (contracts.length === 0) {
                    throw new Error('没有可用合约');
                }

                console.log('📈 默认合约:', contracts[0]);

                // 创建 KLineChart Pro 实例
                const chart = new klinechartspro.KLineChartPro({
                    container: 'app',
                    locale: 'zh-CN',
                    symbol: contracts[0],
                    period: { multiplier: 1, timespan: 'minute', text: '1m' },
                    periods: [
                        { multiplier: 1, timespan: 'minute', text: '1m' },
                        { multiplier: 5, timespan: 'minute', text: '5m' },
                        { multiplier: 15, timespan: 'minute', text: '15m' },
                        { multiplier: 1, timespan: 'hour', text: '1H' },
                        { multiplier: 2, timespan: 'hour', text: '2H' },
                        { multiplier: 3, timespan: 'hour', text: '3H' },
                        { multiplier: 1, timespan: 'day', text: '1D' },
                        { multiplier: 1, timespan: 'week', text: '1W' }
                    ],
                    styles: {
                        candle: {
                            type: 'candle_solid',
                            bar: {
                                upColor: '#26A69A',
                                downColor: '#EF5350',
                                noChangeColor: '#888888'
                            }
                        }
                    },
                    subIndicators: ['VOL', 'MACD', 'ZIGZAG'],
                    datafeed: datafeed
                });

                console.log('✅ KLineChart Pro 初始化完成');

                // ZigZag 配置面板逻辑
                setTimeout(() => {
                    const configBtn = document.getElementById('zigzag-config-btn');
                    const configPanel = document.getElementById('zigzag-config-panel');
                    const closeBtn = document.getElementById('zigzag-close');
                    const applyBtn = document.getElementById('zigzag-apply');
                    const resetBtn = document.getElementById('zigzag-reset');

                    if (!configBtn || !configPanel) {
                        console.warn('⚠️ ZigZag 配置面板元素未找到');
                        return;
                    }

                    // 显示/隐藏配置面板
                    configBtn.addEventListener('click', () => {
                        configPanel.style.display = 'block';
                        configBtn.style.display = 'none';
                    });

                    closeBtn.addEventListener('click', () => {
                        configPanel.style.display = 'none';
                        configBtn.style.display = 'block';
                    });

                    // 应用配置
                    applyBtn.addEventListener('click', () => {
                        const depth = parseInt(document.getElementById('zigzag-depth').value);
                        const deviation = parseFloat(document.getElementById('zigzag-deviation').value);
                        const backstep = parseInt(document.getElementById('zigzag-backstep').value);

                        try {
                            // 移除旧指标
                            chart.removeIndicator('ZIGZAG');
                            // 创建新指标（使用新参数）
                            chart.createIndicator('ZIGZAG', false, { calcParams: [depth, deviation, backstep] });
                            console.log('✅ ZigZag 参数已更新:', { depth, deviation, backstep });
                        } catch (error) {
                            console.error('❌ ZigZag 参数更新失败:', error);
                        }
                    });

                    // 重置为默认参数
                    resetBtn.addEventListener('click', () => {
                        document.getElementById('zigzag-depth').value = 12;
                        document.getElementById('zigzag-deviation').value = 5;
                        document.getElementById('zigzag-backstep').value = 3;
                        document.getElementById('depth-value').textContent = '12';
                        document.getElementById('deviation-value').textContent = '5';
                        document.getElementById('backstep-value').textContent = '3';

                        try {
                            chart.removeIndicator('ZIGZAG');
                            chart.createIndicator('ZIGZAG', false, { calcParams: [12, 5, 3] });
                            console.log('✅ ZigZag 参数已重置');
                        } catch (error) {
                            console.error('❌ ZigZag 重置失败:', error);
                        }
                    });
                }, 1000);
            } catch (error) {
                console.error('❌ 初始化失败:', error);
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
